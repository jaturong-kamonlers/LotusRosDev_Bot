; ════════════════════════════════════════════════════════════════
;  LotusRosBot firmware — PlatformIO (ESP32 DevKit V1 + micro-ROS Galactic)
;  build/flash จาก Jetson:  bash ~/LotusRosDev_Bot/tools/flash.sh build | upload | verify
;  ค่าตั้งหุ่น: include/lotusrosbot_config.h
;  ใช้ USB serial (ค่าเริ่มต้น) · ถ้าจะใช้ WiFi: board_microros_transport = wifi
;    + เพิ่ม -D USE_WIFI_TRANSPORT ใน build_flags + เปิด USE_WIFI_TRANSPORT ใน config
; ════════════════════════════════════════════════════════════════
[platformio]
default_envs = lotusrosbot

[env:lotusrosbot]
platform = espressif32
board = esp32dev
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L

upload_port = /dev/esp32          ; udev symlink (กันเขียนผิดใส่ LiDAR)
upload_protocol = esptool
monitor_port = /dev/esp32
monitor_speed = 115200
monitor_dtr = 0                   ; ไม่แตะ DTR/RTS (กัน ESP32 รีเซ็ต)
monitor_rts = 0

board_microros_distro = galactic
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#22cf9b631b0bbb8861c30469e33b24e9241819ef
    jrowberg/I2Cdevlib-Core                       ; I2C ของ MPU6050
    https://github.com/arcao/Syslog               ; ใช้เมื่อเปิด USE_SYSLOG
    madhephaestus/ESP32Servo@^0.13.0
    madhephaestus/ESP32Encoder @ ^0.10.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1

build_flags =
    -I include
